name: reusable-claims

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Identify workflow copy
        run: echo "WORKFLOW_MARKER=replacement"
      - name: Decode selected OIDC claims
        shell: bash
        run: |
          node <<'NODE'
          const https = require('https');
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=https%3A%2F%2Fexample.invalid%2Freusable-workflow-audit';
          https.get(requestUrl, {
            headers: { Authorization: `bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }
          }, (response) => {
            let body = '';
            response.on('data', (chunk) => { body += chunk; });
            response.on('end', () => {
              if (response.statusCode !== 200) {
                throw new Error(`OIDC request failed with status ${response.statusCode}`);
              }
              const jwt = JSON.parse(body).value;
              const claims = JSON.parse(Buffer.from(jwt.split('.')[1], 'base64url').toString('utf8'));
              const keys = [
                'sub', 'aud', 'repository', 'repository_id',
                'repository_owner', 'repository_owner_id',
                'job_workflow_ref', 'job_workflow_sha',
                'workflow_ref', 'workflow_sha', 'iat', 'exp'
              ];
              const selected = Object.fromEntries(keys.map((key) => [key, claims[key]]));
              console.log(`OIDC_CLAIMS=${JSON.stringify(selected)}`);
            });
          }).on('error', (error) => { throw error; });
          NODE
